<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <title>黃金廣告投手 | 全域流量自動化與廣告佈局專家</title>
    <!-- 這裡放您的 CSS 連結 -->
    <link rel="icon" href="images/icon.png" type="image/png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 自定義 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>

    <section class="container">
        <div style="text-align: center; margin-bottom: 60px; padding-top: 100px;">
            <h1 style="color: var(--orange-accent);">精準流量曝光</h1>
            <p style="color: var(--text-muted);">每一分預算，都要精準擊中靶心。</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <div style="background: var(--blue-card); padding: 30px; border-radius: 12px;">
                <h3>Google 關鍵字廣告</h3>
                <p style="color:#ccc; margin-top:10px;">攔截主動搜尋的高意向客戶。我們擅長挖掘「黃金長尾詞」，降低點擊成本，提高轉換率。</p>
            </div>
            <div style="background: var(--blue-card); padding: 30px; border-radius: 12px;">
                <h3>社群媒體廣告</h3>
                <p style="color:#ccc; margin-top:10px;">在 FB/IG/TikTok 主動出擊。透過視覺衝擊與精準受眾標籤，讓您的品牌在滑動中脫穎而出。</p>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer>
        <div id="footer-placeholder"></div>
    </footer>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 自定義 JS -->
    <script src="script.js"></script>

    <!-- 頁首載入器腳本 -->
    <script src="navbar-loader.js"></script>

    <!-- 頁尾載入器腳本 -->
    <script src="footer-loader.js"></script>
</body>
</html>
