<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <title>黃金廣告投手 | 全域流量自動化與廣告佈局專家</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 自定義 CSS -->
    <link rel="stylesheet" href="style.css">
     <link rel="icon" href="images/icon.png" type="image/png">
</head>
<body>

    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>

    <section class="container" style="padding-top: 120px;">
        <div style="max-width: 600px; margin: 0 auto; background: var(--blue-card); padding: 40px; border-radius: 12px; border: 1px solid var(--border-gold);">
            <h2 style="text-align: center; margin-bottom: 30px;">立即啟動專案</h2>
            <form>
                <label>您的稱呼</label>
                <input type="text" placeholder="怎麼稱呼您？">
                
                <label>聯絡電話 / LINE ID</label>
                <input type="text" placeholder="方便聯繫的方式">
                
                <label>您感興趣的服務</label>
                <select>
                    <option>資產建置 (SEO/站群)</option>
                    <option>流量曝光 (廣告投放)</option>
                    <option>小孩才做選擇，我全都要</option>
                </select>
                
                <label>需求描述</label>
                <textarea rows="4" placeholder="請簡述您的產業與目標..."></textarea>
                
                <button type="submit" class="btn-cta" style="width: 100%; border: none; cursor: pointer;">發送諮詢</button>
            </form>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer>
        <div id="footer-placeholder"></div>
    </footer>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 自定義 JS -->
    <script src="script.js"></script>

    <!-- 頁首載入器腳本 -->
    <script src="navbar-loader.js"></script>

    <!-- 頁尾載入器腳本 -->
    <script src="footer-loader.js"></script>
</body>
</html>
